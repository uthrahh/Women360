name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  server:
    name: Server (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: women360
          POSTGRES_PASSWORD: women360
          POSTGRES_DB: women360_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U women360"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://women360:women360@localhost:5432/women360_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-placeholder-0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-placeholder-0123456789
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm install
      - run: npm run prisma:generate
      # Apply the committed migrations to an empty database, exactly as the
      # production deploy does (`prisma migrate deploy` in render.yaml) — the
      # previous `db push` never exercised the migration files at all.
      - run: npm run prisma:migrate:deploy
      # Fails if schema.prisma has changes with no migration behind them, i.e.
      # code that would run in CI but break on a real deploy.
      - name: Check schema.prisma matches the migrations
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
