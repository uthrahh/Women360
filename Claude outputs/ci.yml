name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: women360
          POSTGRES_PASSWORD: women360
          POSTGRES_DB: women360_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U women360"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://women360:women360@localhost:5432/women360_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-placeholder-0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-placeholder-0123456789
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm install
      - run: npm run prisma:generate
      # No committed migration yet (see prisma/migrations/README.md) — this
      # pushes the schema straight to the ephemeral CI database. Once a
      # real migration has been generated locally with
      # `npm run prisma:migrate` and committed, switch this line to
      # `npm run prisma:migrate:deploy` instead.
      - run: npx prisma db push --accept-data-loss
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install
      # NOTE: `npm run lint` is intentionally not run here yet — the
      # frontend's lint script has no eslint dependency/config installed
      # (see the repository audit). Add it back here once that's fixed.
      - run: npm run build
