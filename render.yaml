# Render Blueprint for the Women360 API.
#
# Usage: in the Render dashboard, "New +" -> "Blueprint" -> connect this
# GitHub repo. Render reads this file and provisions the service below;
# you'll be prompted to fill in the env vars marked `sync: false` (nothing
# sensitive is committed here). See DEPLOYMENT.md for the full walkthrough.
#
# The database is deliberately NOT declared here — this project uses an
# external managed Postgres (Supabase, one of the SRS's approved options)
# rather than Render's own Postgres, whose free tier expires after 30 days
# and would die mid-semester. Point DATABASE_URL at that instead.
services:
  - type: web
    name: women360-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: CORS_ORIGINS
        sync: false
      - key: SUPPORT_EMAIL
        value: support@example.com
